type: leaky
name: local/vigie-credential-stuffing
description: "Detect credential stuffing: many distinct usernames failing to log in from the same IP"
filter: "evt.Meta.vigie_type == 'login_failure' && evt.Meta.remediation == ''"
distinct: "evt.Meta.user_identifier"
groupby: "evt.Meta.source_ip"
capacity: 10
leakspeed: "1m"
blackhole: 5m
labels:
  service: symfony
  type: credential_stuffing
  remediation: true
