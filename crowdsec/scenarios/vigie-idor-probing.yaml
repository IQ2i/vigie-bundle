type: leaky
name: local/vigie-idor-probing
description: >-
  Detect repeated access to a resource not owned by the acting user (IDOR probing). Grouped by user,
  not IP: IDOR is by nature an authenticated-user offense, and an attacker rotating IPs on one account
  must still be caught. Requires the application to populate Subject::$owner (see
  doc/recording.md#subject); does not require "record.ip_address: true".
filter: "evt.Meta.subject_owner != '' && evt.Meta.subject_owner != evt.Meta.user_identifier && evt.Meta.remediation == ''"
groupby: "evt.Meta.user_identifier"
capacity: 5
leakspeed: "1m"
blackhole: 5m
# Emits a username-scoped alert, not the LAPI's default Ip scope. Requires a profile routing on that
# scope, see crowdsec/profiles/vigie.yaml and crowdsec/README.md.
scope:
  type: username
  expression: "evt.Meta.user_identifier"
labels:
  service: symfony
  type: idor
  remediation: true
